# Mismo nombre de proyecto que usaba el compose anterior, para reutilizar sus contenedores y volúmenes
name: project-virtual-catalog

services:
  minio:
    image: minio/minio:latest
    container_name: catalogo_minio
    ports:
      - "9000:9000" # Puerto de la API (S3)
      - "9001:9001" # Puerto de la Consola Web (Interfaz gráfica)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Este servicio crea el bucket automáticamente y luego se apaga
  minio-setup:
    image: minio/mc:latest
    container_name: catalogo_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin password123;
      mc mb local/catalogo-images || true;
      mc anonymous set public local/catalogo-images;
      exit 0;
      "

  api:
    build: ./virtual-catalog-api
    container_name: catalogo_api
    # Aporta todas las variables validadas por Settings (ver virtual-catalog-api/.env.example)
    env_file: ./virtual-catalog-api/.env
    # Sobrescribe solo los valores que cambian dentro de la red de Docker
    environment:
      CORS_ORIGINS: '["http://localhost:4321"]'
      MINIO_ENDPOINT: http://minio:9000 # La API llega a MinIO por la red interna
      MINIO_PUBLIC_URL: http://localhost:9000 # El navegador descarga las imágenes por el host
    volumes:
      - api_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  web:
    build:
      context: ./shoes-web-app
      args:
        PUBLIC_API_URL: http://localhost:8000/api/v1 # Usada por el navegador
    container_name: catalogo_web
    environment:
      INTERNAL_API_URL: http://api:8000/api/v1 # Usada por el servidor (SSR)
    ports:
      - "4321:4321"
    depends_on:
      - api

volumes:
  minio_data:
  api_data:
