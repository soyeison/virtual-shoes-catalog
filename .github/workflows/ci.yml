name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtual-catalog-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: virtual-catalog-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing

  build-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: api-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: virtual-catalog-api
            build-args: ""
          - service: web
            context: shoes-web-app
            build-args: PUBLIC_API_URL=http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          push: false
          tags: virtual-catalog-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
