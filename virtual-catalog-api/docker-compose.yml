version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: catalogo_minio
    ports:
      - "9000:9000" # Puerto de la API (S3)
      - "9001:9001" # Puerto de la Consola Web (Interfaz gráfica)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Este servicio crea el bucket automáticamente y luego se apaga
  minio-setup:
    image: minio/mc:latest
    container_name: catalogo_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin password123;
      mc mb local/catalogo-images || true;
      mc anonymous set public local/catalogo-images;
      exit 0;
      "

volumes:
  minio_data: